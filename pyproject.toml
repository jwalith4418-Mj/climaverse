[project]
name = "climaverse"
version = "0.1.0"
description = "India's AI Climate Decision Twin — PoC for Bharatiya Antariksh Hackathon PS-05"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.0"]

[project.optional-dependencies]
ml = ["torch>=2.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
